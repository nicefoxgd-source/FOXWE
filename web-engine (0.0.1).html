<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web Engine</title>
<style>
:root{--bg:#1b1d22;--p1:#23262d;--p2:#2b2f38;--p3:#353a45;--bd:#3a3f4b;--tx:#e6e8ee;--tx2:#9aa1b0;--ac:#4f8cff;--ac2:#2f5fc4;--ok:#3fbf7f;--er:#ef5b5b;--sw:6px;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--p3);border:1px solid var(--bd);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{background:#40465a}
button.pri{background:var(--ac2);border-color:var(--ac)}
button.pri:hover{background:var(--ac)}
button.on{background:var(--ac2);border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;min-width:0;user-select:text}
input:focus,select:focus,textarea:focus{outline:1px solid var(--ac);border-color:var(--ac)}
input.bad{border-color:var(--er)}
#app{height:100%;display:grid;grid-template-rows:42px minmax(0,1fr) var(--sbh,var(--sw)) var(--bh,240px)}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--bd)}
#top .sp1{flex:1}
#top .logo{font-weight:600;margin-right:6px}
#pname{width:150px}
#main{display:grid;grid-template-columns:var(--lw,240px) var(--slw,var(--sw)) minmax(0,1fr) var(--srw,var(--sw)) var(--rw,300px);min-height:0}
.dock{background:var(--p1);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.dh{display:flex;align-items:center;gap:6px;padding:0 8px;height:30px;flex:none;background:var(--p2);border-bottom:1px solid var(--bd);font-weight:600;font-size:12px;letter-spacing:.02em}
.dh .grow{flex:1}
.dh button{padding:1px 7px;font-size:12px}
.db{flex:1;min-height:0;overflow:auto}
.strip{display:none;align-items:center;justify-content:center;background:var(--p2);cursor:pointer;color:var(--tx2);font-weight:600;border:0;border-radius:0;width:100%;height:100%}
.dock.min .dh,.dock.min .db,.dock.min .dbx{display:none}
.dock.min .strip{display:flex}
#dL.min .strip,#dR.min .strip{writing-mode:vertical-rl;padding:10px 0}
.sp{background:var(--bg);position:relative;touch-action:none;z-index:5}
.sp::before{content:"";position:absolute;background:var(--bd);transition:background .1s}
.sp.v{cursor:col-resize}.sp.h{cursor:row-resize}
.sp.v::before{left:2px;right:2px;top:0;bottom:0}
.sp.h::before{top:2px;bottom:2px;left:0;right:0}
.sp::after{content:"";position:absolute}
.sp.v::after{left:-5px;right:-5px;top:0;bottom:0}
.sp.h::after{top:-5px;bottom:-5px;left:0;right:0}
.sp:hover::before,.sp.act::before{background:var(--ac)}
.sp.off{pointer-events:none}.sp.off::before,.sp.off::after{display:none}
body.dragging{cursor:inherit}
body.dragging iframe,body.dragging #cv{pointer-events:none}
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#101216}
#cbar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--p2);border-bottom:1px solid var(--bd);flex:none}
#cbar select{width:auto}
#wrap{flex:1;min-height:0;overflow:auto;position:relative;touch-action:none}#wrap.panning,#wrap.panning *{cursor:grabbing!important}
#cv{position:relative;min-height:100%;padding:16px}
#host.empty{background:transparent!important;box-shadow:none!important}#host{background:#fff;position:relative;margin:0 auto;min-height:calc(100vh - 160px);flex:none;width:100%;box-shadow:0 0 0 1px #000}
#ov{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.wh{position:absolute;width:14px;cursor:ew-resize;pointer-events:auto;touch-action:none;z-index:4}.wh::before{content:'';position:absolute;left:5px;top:50%;width:4px;height:48px;margin-top:-24px;border-radius:3px;background:#5d6577;transition:background .1s}.wh:hover::before,.wh.act::before{background:var(--ac)}.wh.lk{display:none}#lockB.on{background:#7a5a1e;border-color:#d9a441}#wro{min-width:150px}.box{position:absolute;pointer-events:none;border:2px solid var(--ac);display:none}
.box.hv{border:1px dashed #8fb4ff;border-width:1px}
.box .lbl{position:absolute;left:-2px;top:-19px;background:var(--ac);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.box .rz{position:absolute;right:-6px;bottom:-6px;width:10px;height:10px;background:#fff;border:2px solid var(--ac);pointer-events:auto;cursor:nwse-resize;touch-action:none;display:none}
.box.rzok .rz{display:block}
.tree{padding:4px 0}
.row{display:flex;align-items:center;gap:4px;padding:3px 6px;cursor:pointer;white-space:nowrap;position:relative;touch-action:pan-y}
.row:hover{background:var(--p2)}
.row.sel{background:#2a4a85}
.row .car{width:14px;text-align:center;color:var(--tx2);flex:none}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .tg{font:10px var(--mono);color:var(--tx2);background:var(--bg);padding:0 5px;border-radius:3px}
.row .ac{display:none;gap:2px}
.row:hover .ac,.row.sel .ac{display:flex}
.row .ac b{font-weight:400;color:var(--tx2);padding:0 4px;border-radius:3px}
.row .ac b:hover{background:var(--p3);color:var(--tx)}
.row.dzb::before,.row.dza::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--ac)}
.row.dzb::before{top:0}.row.dza::after{bottom:0}
.row.dzi{outline:2px solid var(--ac);outline-offset:-2px}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--ac2);padding:2px 8px;border-radius:4px;opacity:.9}
.tabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--p1);position:sticky;top:var(--bph,0);z-index:2}
.tabs.bp{top:0;z-index:4}
.tabs button{border-radius:5px 5px 0 0;border-bottom:0;flex:1;padding:3px 0;font-size:12px}
.tabs.bp{padding-bottom:4px;align-items:stretch;flex-wrap:wrap}.tabs.bp .small{flex-basis:100%;margin:0 0 2px}.tabs.bp button{flex:1 1 auto;padding:3px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.25}.tabs.bp button small{font-size:10px;color:var(--tx2);font-weight:400}.tabs.bp button.on small{color:#cfe0ff}.tabs.bp button.has::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:4px}.nt{padding:2px 10px 6px;color:var(--tx2);font-size:11px;background:var(--p1)}
details{border-top:1px solid var(--bd)}
summary{padding:6px 10px;cursor:pointer;font-weight:600;font-size:12px;background:var(--p1);list-style:none;position:sticky;top:0}
summary::before{content:"▸ ";color:var(--tx2)}
details[open]>summary::before{content:"▾ "}
.sec{padding:4px 10px 10px}
.f{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px;align-items:center;margin:4px 0}
.f>label{color:var(--tx2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:ew-resize}
.f.nolab>label{cursor:default}
.f .c{display:flex;gap:4px;align-items:center;min-width:0}
.f .c>input,.f .c>select{flex:1;width:100%}
.f.dis{opacity:.38}
.f.dis .c,.f.dis>label{pointer-events:none}
.seg{display:flex;flex:1;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:3px 2px;font-size:11px;background:var(--bg)}
.seg button.on{background:var(--ac2)}
.sides{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1}
.sides input{text-align:center;padding:3px 2px}
.sub{font-size:11px;color:var(--tx2);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.item{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:6px;margin:5px 0}
.item .g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.item .g label{font-size:10px;color:var(--tx2);display:block}
.item .top{display:flex;gap:4px;align-items:center}
input[type=color]{padding:0;width:30px;flex:none!important;height:24px;border-radius:4px;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--ac)}
.small{font-size:11px;color:var(--tx2)}
#codes .vis{overflow:auto;padding:8px;height:100%;box-sizing:border-box;font-size:12px}.vhd{font-weight:600;margin-bottom:6px;color:var(--tx2)}.vcard{border:1px solid var(--bd);border-radius:7px;padding:8px;margin-bottom:8px;background:var(--p2)}.vcard .vr{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:4px 0}.vcard select,.vcard input{max-width:150px}.vcard input[type=color]{width:42px;padding:0;height:24px}.vst{margin-left:10px;padding-left:8px;border-left:2px solid var(--bd)}.vrow{background:var(--p3);border-radius:5px;padding:5px 6px;margin:4px 0}.vrow .tt{font-weight:600;margin-right:4px}.vrow button{padding:0 6px}.vb{color:var(--tx2);font-size:11px}#codes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:100%;min-height:0}
.cp{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--bd)}
.cp:last-child{border-right:0}
.cp textarea{flex:1;border:0;border-radius:0;resize:none;font:12px/1.5 var(--mono);tab-size:2;white-space:pre;background:#14161b;min-height:0}
.cp .ch{display:flex;gap:6px;align-items:center;padding:3px 8px;background:var(--p2);font-size:12px;flex:none}
.cp .ch .st{font-size:11px;color:var(--tx2);margin-left:auto}
.cp .ch .st.er{color:var(--er)}
.cp .ch .st.ok{color:var(--ok)}
.menu{position:fixed;z-index:60;background:var(--p2);border:1px solid var(--bd);border-radius:7px;padding:4px;min-width:170px;box-shadow:0 8px 24px #0008;max-height:70vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;white-space:nowrap;border:0;background:none;padding:5px 9px}
.menu button:hover{background:var(--ac2)}
.menu .hd{padding:3px 9px;color:var(--tx2);font-size:11px}
.isrch{position:relative;flex:none;padding:6px 8px;background:var(--p1);border-bottom:1px solid var(--bd);z-index:20}.isrch input{width:100%;padding:5px 8px}.isdd{position:absolute;left:8px;right:8px;top:calc(100% - 2px);background:var(--p2);border:1px solid var(--bd);border-radius:7px;box-shadow:0 8px 24px #0008;max-height:320px;overflow:auto;padding:4px;z-index:30}.isdd[hidden]{display:none}.isdd button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:6px 8px}.isdd button.act,.isdd button:hover{background:var(--ac2)}.isdd button small{color:var(--tx2);font-size:11px;white-space:nowrap}.isdd .none{padding:6px 8px;color:var(--tx2)}.f.hl{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px;transition:outline-color .6s}#pm{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;overflow:auto}#pm.on{display:block}#pm .wrap{max-width:720px;margin:0 auto;padding:40px 20px}#pm h1{margin:0 0 4px;font-size:26px}#pm .acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#pm .acts button{padding:8px 14px}#pm .pr{padding:10px 12px;cursor:pointer}#pm .pr:hover{background:var(--p3)}#modal{position:fixed;inset:0;background:#000a;z-index:80;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#mb{background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;width:min(520px,92vw);max-height:88vh;overflow:auto}
#mb h3{margin:0 0 10px}
#mb .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#mb label.ck{display:flex;gap:6px;align-items:center;margin:6px 0}
#mb .fl{display:flex;align-items:center;gap:8px;margin:5px 0;padding:6px 8px;background:var(--p2);border-radius:6px}
#mb .fl span{flex:1;font-family:var(--mono)}.pr{display:flex;align-items:center;gap:6px;margin:5px 0;padding:7px 9px;background:var(--p2);border-radius:7px;border:1px solid transparent}.pr.cur{border-color:var(--ac)}.pr .nm{flex:1;min-width:0}.pr .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr button{padding:2px 7px}.dz{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--tx2);margin:8px 0}.dz.over{border-color:var(--ac);background:#2a3550}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--p3);border:1px solid var(--bd);padding:7px 14px;border-radius:7px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#pm .pr .nm{min-width:0}@media (max-width:640px){.pr{flex-wrap:wrap}#pm .pr .nm{flex:1 1 100%}.pr button{flex:1}#pm .wrap{padding:24px 14px}#pm .acts button{flex:1 1 auto}}
#mtab{display:none}
@media (max-height:560px) and (orientation:landscape),(max-width:600px) and (orientation:portrait){
 html,body{overscroll-behavior:none}
 #app{height:100dvh;grid-template-columns:calc(54px + env(safe-area-inset-left)) minmax(0,1fr);grid-template-rows:42px minmax(0,1fr);position:relative}
 #top{grid-column:1/-1;overflow-x:auto;gap:5px;padding:0 8px;scrollbar-width:none}
 #top::-webkit-scrollbar{display:none}
 #top>*{flex:none}#top .sp1,#top .logo,#saved,#helpB{display:none}
 #pname{width:130px}#top button{padding:5px 10px}
 #main{display:contents}
 #center{grid-row:2;grid-column:2;min-width:0}
 #main>.dock,#app>#dB{grid-row:2;grid-column:2;justify-self:end;width:var(--pw,46%);z-index:10;display:none;border-left:1px solid var(--bd);box-shadow:-6px 0 18px #0008}
 body[data-m=tree]{--pw:42%}body[data-m=insp]{--pw:48%}body[data-m=code]{--pw:62%}
 body[data-m=tree] #center,body[data-m=insp] #center,body[data-m=code] #center{margin-right:var(--pw)}
 body[data-m=tree] #dL,body[data-m=insp] #dR,body[data-m=code] #app>#dB{display:flex}
 .sp{display:none!important}
 .strip,.dh button[data-min]{display:none!important}
 .dock.min .dh{display:flex}.dock.min .db,.dock.min .dbx{display:block}
 #dB .dh .small,#dB .dh button{display:none}
 .row{min-height:34px;align-items:center}.row .ac b{padding:5px 9px;font-size:15px}
 #cbar{flex-wrap:wrap;gap:5px;padding:3px 6px}#cbar .small:not(#wro):not(#selinfo){display:none}
 #codes{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}
 #codes .cp{scroll-snap-align:start;min-width:0}
 #mb{width:min(560px,calc(100vw - 20px));max-height:94dvh;padding:12px}
 #mtab{display:flex;flex-direction:column;grid-row:2;grid-column:1;background:var(--p1);border-right:1px solid var(--bd);padding-left:env(safe-area-inset-left);z-index:11}
 #mtab button{flex:1;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;color:var(--tx2);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px}
 #mtab button b{font-size:16px;font-weight:400}
 #mtab button.on{color:#fff;background:var(--p3);box-shadow:inset 3px 0 0 var(--ac)}
 #pm .wrap{padding:16px 24px}
}
@media (max-width:600px) and (orientation:portrait){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) calc(56px + env(safe-area-inset-bottom))}
 #center{grid-column:1}
 #main>.dock,#app>#dB{grid-column:1;justify-self:stretch;align-self:end;width:auto;height:var(--ph,58%);border-left:0;border-top:1px solid var(--bd);box-shadow:0 -6px 18px #0008}
 body[data-m=tree]{--ph:55%}body[data-m=insp]{--ph:60%}body[data-m=code]{--ph:68%}
 body[data-m=tree] #center,body[data-m=insp] #center,body[data-m=code] #center{margin-right:0;margin-bottom:var(--ph)}
 #mtab{flex-direction:row;grid-row:3;grid-column:1;border-right:0;border-top:1px solid var(--bd);padding:0 0 env(safe-area-inset-bottom)}
 #mtab button{border-bottom:0;border-right:1px solid var(--bd);font-size:11px}#mtab button:last-child{border-right:0}
 #mtab button.on{box-shadow:inset 0 3px 0 var(--ac)}
 #top button{padding:7px 11px}
 #pm .wrap{padding:22px 14px}
}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <button id="menuB" title="Menu: simpan, keluar ke daftar proyek, ekspor, impor">☰ Menu</button>
  <span class="logo">Web Engine</span>
  <input id="pname" value="Proyek baru" aria-label="Nama proyek"><span class="small" id="saved" style="min-width:110px"></span>
  <button id="undoB" title="Urungkan (Ctrl+Z)">↶</button><button id="redoB" title="Ulangi (Ctrl+Y)">↷</button>
  <button id="addB" class="pri">+ Elemen</button>
  <span class="sp1"></span>
  <button id="termB" title="Ganti istilah: Web designer (display, flex…) atau bahasa awam (Cara tampil, Susun otomatis…)">Istilah: Web</button>
  <button id="prevB">Pratinjau</button>
  <button id="saveB">Simpan</button>
  <button id="expB" class="pri">Ekspor</button>
  <button id="projB" title="Daftar proyek tersimpan di browser ini">Proyek</button>
  <button id="impB" title="Impor file HTML, CSS, JS, atau JSON">Impor</button>
  <button id="helpB">?</button>
 </div>
 <div id="main">
  <section class="dock" id="dL">
   <div class="dh"><span class="grow">Daftar elemen</span><button data-min="l" title="Kecilkan">–</button></div>
   <div class="db"><div class="tree" id="tree"></div></div>
   <button class="strip" data-exp="l">Daftar elemen ▸</button>
  </section>
  <div class="sp v" id="sL"></div>
  <section id="center">
   <div id="cbar">
    <span class="small">Lebar halaman</span>
    <select id="wsel"></select>
    <span class="small" id="wro"></span>
    <button id="lockB" title="Kunci lebar: mencegah lebar kanvas berubah karena sentuhan atau seret yang tidak sengaja">🔓 Bebas</button>
    <span class="zm" style="display:inline-flex;gap:2px;margin-left:8px"><button id="zo" title="Perkecil (Ctrl + scroll mouse)">−</button><button id="zr" title="Kembali ke 100%" style="min-width:56px">100%</button><button id="zi" title="Perbesar (Ctrl + scroll mouse)">+</button></span>
    <span class="small" id="selinfo" style="margin-left:auto"></span>
   </div>
   <div id="wrap"><div id="cv"><div id="host"></div><div id="ov"><div class="wh" id="whL" title="Seret untuk mengubah lebar kanvas (klik dua kali = penuh)"></div><div class="wh" id="whR" title="Seret untuk mengubah lebar kanvas (klik dua kali = penuh)"></div><div class="box hv" id="hovB"></div><div class="box" id="selB"><span class="lbl"></span><span class="rz"></span></div></div></div></div>
  </section>
  <div class="sp v" id="sR"></div>
  <section class="dock" id="dR">
   <div class="dh"><span class="grow">Pengaturan</span><button data-min="r" title="Kecilkan">–</button></div>
   <div class="isrch"><input id="isq" type="search" placeholder="Cari pengaturan… (mis. warna, jarak, bayangan)" autocomplete="off" spellcheck="false"><div id="isdd" class="isdd" hidden></div></div>
   <div class="db" id="insp"></div>
   <button class="strip" data-exp="r">◂ Pengaturan</button>
  </section>
 </div>
 <div class="sp h" id="sB"></div>
 <section class="dock" id="dB">
  <div class="dh"><span>Kode</span><span class="small">dua arah: ketik kode, daftar dan pengaturan ikut berubah</span><span class="grow"></span><button data-min="b" title="Kecilkan">–</button></div>
  <div class="db dbx" style="overflow:hidden"><div id="codes">
   <div class="cp"><div class="ch"><b>HTML</b><span class="st" id="stH"></span></div><textarea id="taH" spellcheck="false"></textarea></div>
   <div class="cp"><div class="ch"><b>CSS</b><span class="st" id="stC"></span></div><textarea id="taC" spellcheck="false"></textarea></div>
   <div class="cp"><div class="ch"><b>JS</b><span class="st" id="stJ" title="JavaScript dijalankan di kanvas (live) dan ikut diekspor.">dijalankan di kanvas</span></div><textarea id="taJ" spellcheck="false" placeholder="// JavaScript (opsional). Belum dijalankan di kanvas."></textarea></div>
   <div class="cp"><div class="ch"><b>Visual</b><span class="st" id="stV">untuk elemen yang dipilih</span></div><div class="vis" id="vis"></div></div>
  </div></div>
  <button class="strip" data-exp="b">Kode ▴</button>
 </section>
